[package]
name = "strata"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Zero-setup DICOM viewer: point one binary at a folder of CT/MRI files and view them in the browser"
repository = "https://github.com/ethanstoner/strata"
homepage = "https://github.com/ethanstoner/strata"
readme = "../../README.md"
build = "build.rs"
# "strata" on crates.io belongs to an unrelated project; this is distributed
# as prebuilt binaries (cargo-dist), not through crates.io.
publish = false

# The library keeps its original name so `strata_server::` paths are stable.
[lib]
name = "strata_server"
path = "src/lib.rs"

[[bin]]
name = "strata"
path = "src/main.rs"

[package.metadata.dist]
dist = true

[dependencies]
strata-dicom = { path = "../strata-dicom" }
dicom.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
tokio.workspace = true
tower.workspace = true
clap.workspace = true
rayon.workspace = true
include_dir.workspace = true
ureq.workspace = true
zip.workspace = true
sha2.workspace = true
dirs.workspace = true
open.workspace = true

[dev-dependencies]
tempfile.workspace = true
